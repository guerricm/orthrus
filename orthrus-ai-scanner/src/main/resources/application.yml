server:
  port: 8091
  shutdown: graceful

spring:
  main:
    web-application-type: reactive
  codec:
    max-in-memory-size: 50MB
  lifecycle:
    timeout-per-shutdown-phase: 30s
  ai:
    # Provider is chosen here; code only depends on ChatClient. Set to anthropic | openai | ollama
    # to activate that provider (its api-key / base-url must then be provided). "none" keeps the
    # context loadable with no LLM credentials (used until orthrus.ai.enabled is turned on).
    model:
      chat: ${ORTHRUS_AI_PROVIDER:none}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    openai:
      api-key: ${OPENAI_API_KEY:}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

orthrus:
  master:
    url: ${ORTHRUS_MASTER_URL:http://localhost:8080}
    internal-token: "change-me-in-production"
    heartbeat-interval-ms: 10000
  slave:
    id: ${SLAVE_ID:${HOSTNAME:localhost}:${server.port}}
    advertised-url: ${SLAVE_ADVERTISED_URL:http://${HOSTNAME:localhost}:${server.port}}

  ai:
    # Master switch for the LLM agents. When false the module still boots and registers, but tasks
    # are executed by a deterministic echo strategy (useful for wiring/integration tests).
    enabled: ${ORTHRUS_AI_ENABLED:false}
    # Scanner families this AI node advertises to the manager (comma-separated ScannerFamily names).
    # The manager only routes these phases here; the rest stay on the deterministic workers.
    families: ${ORTHRUS_AI_FAMILIES:INJECTION,XSS,LOGIC,CONFIGURATION,HTTP,JWT,SSL,BOLA}
    scanner:
      model: ${ORTHRUS_AI_SCANNER_MODEL:}
      # Hidden reasoning of thinking models (Qwen3...) on Ollama; off, as it multiplies the latency of
      # every agent turn (one model call per tool call).
      think: ${ORTHRUS_AI_SCANNER_THINK:false}
    budget:
      max-http-calls-per-operation: 40
      # One model round trip per tool call: the agent stops after this many.
      max-tool-iterations: 12
      # Characters of each probe response body fed back to the model.
      max-response-chars: 1500
      # Time one agent may spend on one endpoint. A task gets this time for each wave of endpoints
      # probed in parallel, plus one wave of margin, so its budget grows with the API size.
      endpoint-timeout-seconds: 300
      # Ceiling on a whole task, recon included, whatever its endpoint count.
      task-timeout-seconds: 14400

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
