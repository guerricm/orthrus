<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: layout(~{::main}, 'Orthrus DAST - AI Campaign')}">
<body>
<main>
    <div class="row mb-4 mt-4">
        <div class="col-12">
            <h1 class="fw-bold" style="color: var(--primary-color);">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
                    class="bi bi-robot me-2 mb-1" viewBox="0 0 16 16">
                    <path d="M6 12.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5M3 8.062C3 6.76 4.235 5.765 5.53 5.886a26.6 26.6 0 0 0 4.94 0C11.765 5.765 13 6.76 13 8.062v1.157a.93.93 0 0 1-.765.935c-.845.147-2.34.346-4.235.346-1.895 0-3.39-.2-4.235-.346A.93.93 0 0 1 3 9.219zm4.542-.827a.25.25 0 0 0-.217.068l-.92.9a24.767 24.767 0 0 1-1.871-.183.25.25 0 0 0-.068.495c.55.076 1.232.149 2.02.193a.25.25 0 0 0 .189-.071l.754-.736.847 1.71a.25.25 0 0 0 .404.062l.932-.97a25.286 25.286 0 0 0 1.922-.188.25.25 0 0 0-.068-.495c-.538.074-1.207.145-1.98.189a.25.25 0 0 0-.166.076l-.754.785-.842-1.7a.25.25 0 0 0-.182-.135Z"/>
                    <path d="M8.5 1.866a1 1 0 1 0-1 0V3h-2A4.5 4.5 0 0 0 1 7.5V8a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1v1a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1v-.5A4.5 4.5 0 0 0 10.5 3h-2zM14 7.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7.5A3.5 3.5 0 0 1 5.5 4h5A3.5 3.5 0 0 1 14 7.5"/>
                </svg>
                AI Campaign
            </h1>
            <p class="text-muted mt-2">
                Describe the target and what you want to achieve. The AI orchestrator fingerprints the
                target, plans the scan (discoverer and scanner families), and launches it on the manager.
            </p>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="glass-card">
                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Error</div>

                <div th:if="${plan}" class="alert alert-info" role="alert">
                    <strong>Plan:</strong>
                    <span th:text="${plan.rationale}">rationale</span>
                    <span th:if="${plan.recommendedDiscoverer}"> (discoverer:
                        <code th:text="${plan.recommendedDiscoverer}">openapi</code>)</span>
                </div>

                <form th:action="@{/ai/campaign}" method="post">
                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label for="target" class="form-label">Target URL</label>
                        <input type="url" class="form-control" id="target" name="target" required
                            placeholder="https://api.example.com/openapi.json">
                        <div class="form-text">An app root, or an OpenAPI/Swagger document URL.</div>
                    </div>

                    <div class="mb-3">
                        <label for="objective" class="form-label">Objective <span class="text-muted">(optional)</span></label>
                        <textarea class="form-control" id="objective" name="objective" rows="3"
                            placeholder="e.g. Focus on authentication and injection flaws on the public API."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-play-fill me-1" viewBox="0 0 16 16">
                            <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/>
                        </svg>
                        Launch AI Campaign
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
