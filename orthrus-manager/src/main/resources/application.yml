server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

orthrus:
  master:
    url: http://localhost:8080
    internal-token: "change-me-in-production"
    slave-timeout-seconds: 30
    offline-slave-deletion-minutes: 15
  slave:
    advertised-url: http://not-used
  security:
    admin:
      username: ${ADMIN_USERNAME:superadmin}
      password: ${ADMIN_PASSWORD:superadmin}

spring:
  http:
    reactiveclient:
      # Bounds every WebClient.Builder-derived call (nodes, orchestrator): a black-holed
      # peer fails fast instead of holding a scheduler cycle.
      connect-timeout: 5s
  lifecycle:
    timeout-per-shutdown-phase: 30s
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:45432/orthrus}
    username: ${SPRING_R2DBC_USERNAME:orthrus}
    password: ${SPRING_R2DBC_PASSWORD:orthrus}
    pool:
      # Docker Swarm's overlay network (IPVS) silently drops TCP connections idle for 15
      # minutes, and NAT/firewalls often do the same. Retire idle connections well before
      # that, cap their lifetime, and check each one with a round trip on acquire, so the
      # pool never hands out a connection the network has already killed.
      max-idle-time: 5m
      max-life-time: 30m
      validation-depth: remote
      acquire-retry: 3
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  main:
    web-application-type: reactive
  codec:
    max-in-memory-size: 50MB
  messages:
    fallback-to-system-locale: false

logging:
  level:
    org.apache.pdfbox.pdmodel.font.PDType1Font: ERROR
