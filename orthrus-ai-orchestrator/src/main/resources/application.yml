server:
  port: 8090
  shutdown: graceful

spring:
  main:
    web-application-type: reactive
  codec:
    max-in-memory-size: 50MB
  lifecycle:
    timeout-per-shutdown-phase: 30s
  ai:
    model:
      chat: ${ORTHRUS_AI_PROVIDER:none}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    openai:
      api-key: ${OPENAI_API_KEY:}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

orthrus:
  ai:
    enabled: ${ORTHRUS_AI_ENABLED:false}
    orchestrator:
      model: ${ORTHRUS_AI_ORCHESTRATOR_MODEL:}
      # Shared secret the manager presents on /api/**; the same ORTHRUS_INTERNAL_TOKEN as the nodes.
      internal-token: ${ORTHRUS_INTERNAL_TOKEN:change-me-in-production}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
