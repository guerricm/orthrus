name: Build and Test

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Maven Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: 'maven'

      - name: Build with Maven
        run: |
          # Compilation et exécution des tests. 
          # Le blocage sur le formatage est désactivé par défaut comme demandé.
          mvn clean package -Dcheckstyle.failOnViolation=false -Dspring-javaformat.failOnViolation=false --no-transfer-progress
