name: Release

on:
  workflow_dispatch:
    inputs:
      release_message:
        description: 'Optional message for the release tag'
        required: false
        default: 'Automated release'

jobs:
  release:
    name: Release and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for changelog

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: 'maven'

      - name: Extract Current Version
        id: extract_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=revision -q -DforceStdout --no-transfer-progress)
          if [[ "$VERSION" != *"-SNAPSHOT" ]]; then
            echo "Error: Current version is not a SNAPSHOT ($VERSION)"
            exit 1
          fi
          RELEASE_VERSION=${VERSION%-SNAPSHOT}
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          echo "Preparing release for version $RELEASE_VERSION"

      - name: Update POM to Release Version
        run: |
          mvn versions:set-property -Dproperty=revision -DnewVersion=${{ env.RELEASE_VERSION }} -DgenerateBackupPoms=false --no-transfer-progress

      - name: Commit and Tag Release
        run: |
          git add pom.xml
          git commit -m "chore(release): version ${{ env.RELEASE_VERSION }}"
          git tag -a "v${{ env.RELEASE_VERSION }}" -m "${{ github.event.inputs.release_message }}"

      - name: Build and Push Docker Images
        run: |
          # Build Docker images with the release version and push to DockerHub
          # Formatting errors are disabled from blocking the release build
          mvn clean package spring-boot:build-image \
            -Dcheckstyle.failOnViolation=false \
            -Dspring-javaformat.failOnViolation=false \
            -Dspring-boot.build-image.publish=true \
            -DCI_REGISTRY_USER=${{ secrets.DOCKERHUB_USER }} \
            -DCI_REGISTRY_PASSWORD=${{ secrets.DOCKERHUB_PASSWORD }} \
            -Ddockerhub.user=${{ secrets.DOCKERHUB_USER }} \
            --no-transfer-progress

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use GitHub CLI to create a release with auto-generated release notes (changelog from commits)
          gh release create "v${{ env.RELEASE_VERSION }}" \
            --title "Release v${{ env.RELEASE_VERSION }}" \
            --generate-notes

      - name: Calculate Next Minor Version
        id: calculate_next_version
        run: |
          IFS='.' read -ra ADDR <<< "${{ env.RELEASE_VERSION }}"
          MAJOR=${ADDR[0]}
          MINOR=${ADDR[1]}
          NEXT_MINOR=$((MINOR + 1))
          NEXT_VERSION="$MAJOR.$NEXT_MINOR.0-SNAPSHOT"
          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV
          echo "Next development version will be $NEXT_VERSION"

      - name: Update POM to Next Snapshot
        run: |
          mvn versions:set-property -Dproperty=revision -DnewVersion=${{ env.NEXT_VERSION }} -DgenerateBackupPoms=false --no-transfer-progress

      - name: Commit and Push Next Development Iteration
        run: |
          git add pom.xml
          git commit -m "chore: prepare next development iteration ${{ env.NEXT_VERSION }}"
          git push origin main
          git push origin "v${{ env.RELEASE_VERSION }}"
